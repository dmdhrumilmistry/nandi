[package]
name = "nandi-gateway"
description = "HTTP gateway, stdio MCP wrapper, hooks, admin API and telemetry for nandi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
nandi-core.workspace = true
nandi-engine.workspace = true
nandi-policy.workspace = true
nandi-detect.workspace = true
nandi-audit.workspace = true
nandi-identity.workspace = true
nandi-proto.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
parking_lot.workspace = true
base64.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "time", "sync", "signal", "fs"] }
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "client-legacy", "http1", "http2"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "webpki-tokio", "http1", "http2", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }

[dev-dependencies]
tempfile = "3"
