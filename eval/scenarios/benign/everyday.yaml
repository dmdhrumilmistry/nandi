        text: "नमस्ते टीम! Launch is on track 👩‍💻🚀. Merci beaucoup, à demain. 東京オフィスは月曜日に開きます。"
      expect: clean

- name: travel-agent-conversation
  kind: benign
  category: a2a
  steps:
    - a2a: { peer: travel, context_id: ctx-5512, text: "Book a flight from BOM to SFO on 12 Dec, aisle seat" }
      expect: clean
    - a2a: { peer: travel, direction: inbound, context_id: ctx-5512, text: "Booked AI 179, seat 23C. Confirmation ZK4Q7P." }
      expect: clean
    - card: { peer: travel, digest: 4be1c0, signed: true }
      expect: clean

- name: verified-refund
  kind: benign
  category: policy
  rules: |
    sequences:
      - id: refund-needs-verification
        tool: refund
        requires_prior: { tool: verify_identity, success: true, same_args: [user_id] }
        action: deny
  steps:
    - call: { server: crm, tool: verify_identity, args: { user_id: u-17 } }
    - result: { server: crm, tool: verify_identity, text: verified }
    - call: { server: crm, tool: refund, args: { user_id: u-17, amount: 450 } }
      expect: allow

- name: planned-workflow
  kind: benign
  category: plan
  config: { plan: { mode: enforce } }
  steps:
    - plan:
        task: weekly report
        steps:
          - { id: read, tool: mail/read_inbox }
          - { id: send, tool: mail/send_email, after: [read], args: { to: { glob: "*@corp.example" } } }
      expect: clean
    - call: { server: mail, tool: read_inbox, args: {} }
      expect: allow
    - call: { server: mail, tool: send_email, args: { to: lead@corp.example, body: "weekly summary attached" } }
      expect: allow

- name: varied-calls-no-loop
  kind: benign
  category: behavior
  config: { behavior: { loop_threshold: 4 } }
  steps:
    - call: { server: search, tool: query, args: { q: rust } }
    - call: { server: search, tool: query, args: { q: tokio } }
    - call: { server: search, tool: query, args: { q: hyper } }
    - call: { server: search, tool: query, args: { q: axum } }
      expect: clean

- name: small-payment-under-threshold
  kind: benign
  category: policy
  rules: |
    rules:
      - id: big-payment
        match: { tool: "*pay*", args: { amount: { gt: 1000 } } }
        action: ask
  steps:
    - call: { server: bank, tool: pay_invoice, args: { invoice: INV-9, amount: 120 } }
      expect: clean

- name: sensor-declared-read
  kind: benign
  category: sensor
  config: { sensor: { enabled: true } }
  steps:
    - call: { server: local, tool: read_file, args: { path: /home/dev/project/.env } }
    - event: { type: file, pid: 4242, comm: node, path: /home/dev/project/.env, write: false }
      expect: allow
    - event: { type: file, pid: 4242, comm: node, path: /home/dev/project/src/main.rs, write: false }
      expect: clean
