[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/dmdhrumilmistry/nandi"
authors = ["Dhrumil Mistry"]

[workspace.dependencies]
nandi-core = { path = "crates/nandi-core" }
nandi-detect = { path = "crates/nandi-detect" }
nandi-policy = { path = "crates/nandi-policy" }
nandi-audit = { path = "crates/nandi-audit" }
nandi-identity = { path = "crates/nandi-identity" }
nandi-proto = { path = "crates/nandi-proto" }
nandi-engine = { path = "crates/nandi-engine" }
nandi-gateway = { path = "crates/nandi-gateway" }
nandi-sense = { path = "crates/nandi-sense" }
nandi-ml = { path = "crates/nandi-ml" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
uuid = { version = "1", default-features = false, features = ["v7", "std"] }
sha2 = "0.11"
hex = "0.4"
base64 = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json", "ansi"] }
tokio = { version = "1", default-features = false }
parking_lot = "0.13"
aho-corasick = "1"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
clap = { version = "4", features = ["derive", "env"] }

[profile.dev]
# Keep the target dir small; use RUSTFLAGS or a local override for debugging.
debug = 0

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3
