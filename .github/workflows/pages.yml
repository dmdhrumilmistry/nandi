name: Website

on:
  push:
    branches: [main]
    paths: ["docs/**", "website/**", "examples/**", "crates/xtask/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["docs/**", "website/**", "examples/**", "crates/xtask/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask site --out _site --base-url https://dmdhrumilmistry.github.io/nandi
      - name: Check internal links and anchors
        run: cargo xtask check-links _site
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
