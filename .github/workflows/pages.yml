name: Website

on:
  push:
    branches: [main]
    paths: ["docs/**", "website/**", "examples/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["docs/**", "website/**", "examples/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown==3.10.2 pygments==2.19.2
      - run: python website/build.py --out _site --base-url https://dmdhrumilmistry.github.io/nandi
      - name: Check internal links
        run: |
          python - <<'PY'
          import re, pathlib, sys
          root = pathlib.Path("_site")
          bad = []
          for page in root.rglob("*.html"):
              for url in re.findall(r'(?:href|src)="([^"#]+)(?:#[^"]*)?"', page.read_text()):
                  if re.match(r"^(https?:|mailto:|data:)", url):
                      continue
                  if not (page.parent / url).resolve().exists():
                      bad.append(f"{page.relative_to(root)} -> {url}")
          print("\n".join(bad))
          sys.exit(1 if bad else 0)
          PY
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
