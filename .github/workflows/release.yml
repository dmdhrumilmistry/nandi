name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: nandi-*
      - name: Package
        run: |
          set -euo pipefail
          mkdir dist
          for dir in artifacts/nandi-*; do
            target=${dir#artifacts/nandi-}
            name="nandi-${GITHUB_REF_NAME}-${target}"
            mkdir "$name"
            cp "$dir"/nandi* "$name"/
            chmod +x "$name"/nandi* # artifacts do not keep the executable bit
            cp LICENSE README.md "$name"/
            cp -r examples "$name"/
            if [ -d deploy ]; then cp -r deploy "$name"/; fi # MDM kits and service files
            case "$target" in
              *windows*) zip -qr "dist/$name.zip" "$name"; out="$name.zip" ;;
              *) tar czf "dist/$name.tar.gz" "$name"; out="$name.tar.gz" ;;
            esac
            (cd dist && sha256sum "$out" > "$out.sha256")
          done
          ls -la dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
