name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  # Release binaries for every target, smoke-tested (QEMU for the
  # cross-compiled Linux ones).
  build:
    uses: ./.github/workflows/build.yml

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  ml:
    runs-on: ubuntu-latest
    env:
      ORT_VERSION: 1.31.1
      # protectai/deberta-v3-base-prompt-injection-v2 (Apache-2.0), pinned.
      MODEL_REPO: protectai/deberta-v3-base-prompt-injection-v2
      MODEL_REV: 90c9989b1a342275dd0d1a95aad283c04e075671
      ASSETS: ${{ github.workspace }}/.ml-assets
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ml
      - run: cargo clippy -p nandi -p nandi-ml --features nandi/ml --all-targets --locked -- -D warnings
      - run: cargo build -p nandi --features ml --locked
      - run: cargo test -p nandi-ml --features onnx --locked
      - run: cargo test -p nandi --features ml --locked --bin nandi
      - name: Cache ONNX Runtime and model
        id: assets
        uses: actions/cache@v4
        with:
          path: .ml-assets
          key: ml-assets-ort${{ env.ORT_VERSION }}-${{ env.MODEL_REV }}
      - name: Download ONNX Runtime and model
        if: steps.assets.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$ASSETS/model"
          curl -fsSL --retry 3 "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VERSION/onnxruntime-linux-x64-$ORT_VERSION.tgz" \
            | tar -xz -C "$ASSETS"
          for f in model.onnx tokenizer.json config.json; do
            curl -fsSL --retry 3 -o "$ASSETS/model/$f" "https://huggingface.co/$MODEL_REPO/resolve/$MODEL_REV/onnx/$f"
          done
          du -sh "$ASSETS"/*
      - name: End-to-end classifier test (real model)
        run: |
          set -euo pipefail
          export ORT_DYLIB_PATH="$ASSETS/onnxruntime-linux-x64-$ORT_VERSION/lib/libonnxruntime.so"
          export NANDI_ML_MODEL="$ASSETS/model/model.onnx"
          cargo test -p nandi-ml --features onnx --locked -- --ignored --nocapture 2>&1 | tee ml.txt
          echo '### ML classifier (debug build, ONNX Runtime release, 1 intra-op thread)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E 'load:|score|warm|Vm' ml.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Gateway starts with the classifier
        run: |
          set -euo pipefail
          BIN=target/debug/nandi
          DIR=$(mktemp -d)
          "$BIN" init --dir "$DIR" >/dev/null
          cp "$DIR/nandi.yaml" "$DIR/base.yaml"
          printf 'ml:\n  enabled: true\n  model: %s\n  onnxruntime: %s\n' \
            "$ASSETS/model/model.onnx" "$ASSETS/onnxruntime-linux-x64-$ORT_VERSION/lib/libonnxruntime.so" >> "$DIR/nandi.yaml"
          "$BIN" run -c "$DIR/nandi.yaml" 2> "$DIR/log" & PID=$!
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8788/healthz >/dev/null && break; sleep 0.5; done
          curl -sf http://127.0.0.1:8788/healthz
          RSS=$(awk '/VmRSS/ {print $2}' /proc/$PID/status)
          kill $PID; wait $PID || true
          cat "$DIR/log"
          echo "gateway idle RSS with the classifier loaded: $((RSS / 1024)) MiB" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -q 'prompt-injection classifier loaded' "$DIR/log"
          # A model that cannot be loaded stops startup under fail_mode: closed.
          printf 'ml:\n  enabled: true\n  model: %s/missing.onnx\n' "$DIR" >> "$DIR/base.yaml"
          if "$BIN" run -c "$DIR/base.yaml" 2> "$DIR/err"; then echo "expected startup to fail"; exit 1; fi
          cat "$DIR/err"
          grep -q 'loading the ML classifier' "$DIR/err"

  static-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --workspace --target ${{ matrix.target }}
      - name: Smoke test and footprint
        shell: bash
        run: |
          set -euo pipefail
          BIN=target/${{ matrix.target }}/release/nandi
          ls -la "$BIN"
          file "$BIN"
          DIR=$(mktemp -d)
          "$BIN" init --dir "$DIR" >/dev/null
          "$BIN" policy validate -c "$DIR/nandi.yaml"
          "$BIN" run -c "$DIR/nandi.yaml" & PID=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8788/healthz >/dev/null && break; sleep 0.5; done
          curl -sf http://127.0.0.1:8788/healthz
          RSS=$(awk '/VmRSS/ {print $2}' /proc/$PID/status)
          SIZE=$(stat -c %s "$BIN")
          kill $PID; wait $PID || true
          echo "binary: $SIZE bytes, idle RSS: $RSS KiB"
          echo "### ${{ matrix.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo "binary: $((SIZE / 1024 / 1024)) MiB, idle RSS: $((RSS / 1024)) MiB" >> "$GITHUB_STEP_SUMMARY"
          "$BIN" eval --dir eval/scenarios --min-detection 1.0 --max-false-positives 0.0

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: eval
      - name: Attack and false-positive evaluation (release build)
        run: cargo test --release --locked -p nandi-eval -- --nocapture bundled_corpus 2>&1 | tee eval.txt
      - name: Summary
        if: always()
        run: grep -A40 '^category' eval.txt >> "$GITHUB_STEP_SUMMARY" || true

  ebpf:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ebpf-${{ matrix.runner }}
      - run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev
      - run: clang --version && uname -r
      - name: Clippy with the eBPF backend
        run: cargo clippy -p nandi-sense -p nandi --features nandi/ebpf --all-targets --locked -- -D warnings
      - name: Build
        run: cargo build -p nandi --features ebpf --locked
      - name: BPF object
        run: |
          OBJ=$(find target/debug/build -name sense.bpf.o | head -1)
          file "$OBJ"
          llvm-objdump --section-headers "$OBJ" | grep -E 'tracepoint|maps|license'
      - name: Privileged integration test
        shell: bash
        run: |
          set -euo pipefail
          BIN=$(cargo test -p nandi-sense --features ebpf --locked --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.kind == ["lib"]) | .executable')
          echo "test binary: $BIN"
          # All tests, including the ignored ones that need root, then the
          # eBPF tests a few more times to catch flakiness.
          sudo "$BIN" --include-ignored --nocapture --test-threads 1
          for _ in 1 2 3; do sudo "$BIN" --ignored ebpf_ --test-threads 1; done
      - name: nandi sense with the eBPF backend (root, then capabilities)
        shell: bash
        run: |
          set -euo pipefail
          BIN=$PWD/target/debug/nandi
          check() {
            local label=$1; shift
            local DIR; DIR=$(mktemp -d)
            chmod 755 "$DIR"
            printf 'sensor:\n  enabled: true\n  backend: ebpf\n  agent_comms: [nandi-ci-agent]\n  sensitive_paths: ["*/ci.env"]\n  llm_hosts: []\n' > "$DIR/nandi.yaml"
            echo "X=1" > "$DIR/ci.env"
            "$@" "$BIN" sense -c "$DIR/nandi.yaml" > "$DIR/events.jsonl" 2> "$DIR/sense.log" &
            local pid=$!
            for _ in $(seq 1 50); do grep -q "host sensor started" "$DIR/sense.log" 2>/dev/null && break; sleep 0.2; done
            bash -c "exec -a nandi-ci-agent bash -c 'sleep 0.3; cat $DIR/ci.env >/dev/null; /bin/true; exit 0'"
            sleep 2
            sudo pkill -INT -f "$BIN sense -c $DIR" || true
            wait "$pid" || true
            echo "== $label: log"; cat "$DIR/sense.log"
            echo "== $label: events"; cat "$DIR/events.jsonl"
            grep -q 'ebpf backend' "$DIR/sense.log"
            grep '"type":"file"' "$DIR/events.jsonl" | grep -q 'ci.env'
            grep '"type":"process"' "$DIR/events.jsonl" | grep -q '/true'
          }
          check root sudo
          sudo setcap cap_bpf,cap_perfmon,cap_dac_read_search,cap_sys_ptrace+ep "$BIN"
          getcap "$BIN"
          check capabilities env

  # Managed settings from the real system sources on each platform, and the
  # deployment kits in deploy/mdm.
  managed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: managed
      - run: cargo build --locked -p nandi
      - name: Linux, /etc/nandi
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          BIN=target/debug/nandi
          sudo mkdir -p /etc/nandi/managed.d
          printf 'mode: enforce\n' | sudo tee /etc/nandi/managed.yaml >/dev/null
          printf 'approvals: { timeout_secs: 45 }\n' | sudo tee /etc/nandi/managed.d/10-approvals.yaml >/dev/null
          "$BIN" managed
          "$BIN" managed --json | jq -e '.settings.mode == "enforce" and .settings.approvals.timeout_secs == 45 and (.sources | length) == 2'
          # The example kit is valid (policy paths are only checked by `run`).
          "$BIN" managed --file deploy/mdm/linux/managed.yaml
          systemd-analyze verify --user deploy/mdm/linux/nandi.service deploy/mdm/linux/nandi-discover.service deploy/mdm/linux/nandi-discover.timer 2>&1 | grep -v "Cannot access\|not executable" || true
      - name: macOS, configuration profile
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          BIN=target/debug/nandi
          for f in deploy/mdm/macos/*.plist deploy/mdm/macos/nandi.mobileconfig; do plutil -lint "$f"; done
          bash -n deploy/mdm/macos/install-nandi.sh
          bash -n deploy/mdm/macos/jamf-extension-attribute.sh
          # What macOS writes when the profile is installed: a binary plist.
          sudo mkdir -p "/Library/Managed Preferences"
          sudo plutil -convert binary1 -o "/Library/Managed Preferences/io.github.dmdhrumilmistry.nandi.plist" \
            deploy/mdm/macos/io.github.dmdhrumilmistry.nandi.plist
          "$BIN" managed
          "$BIN" managed --json | jq -e '.settings.mode == "enforce" and .settings.approvals.timeout_secs == 300
            and .settings.servers.osv.enabled == true and (.sources | length) == 2 and .error == null'
      - name: Windows, registry policy
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($f in Get-ChildItem deploy/mdm/windows -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors; throw "$($f.Name) does not parse" }
          }
          [xml](Get-Content deploy/mdm/windows/nandi.admx -Raw) | Out-Null
          [xml](Get-Content deploy/mdm/windows/en-US/nandi.adml -Raw) | Out-Null
          # What the ADMX policy writes: REG_MULTI_SZ, one YAML line per string.
          New-Item -Path "HKLM:\SOFTWARE\Policies\nandi" -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\Policies\nandi" -Name Config -PropertyType MultiString -Force `
            -Value @("mode: enforce", "approvals:", "  timeout_secs: 45") | Out-Null
          .\target\debug\nandi.exe managed
          $out = .\target\debug\nandi.exe managed --json | ConvertFrom-Json
          if ($out.settings.mode -ne "enforce" -or $out.settings.approvals.timeout_secs -ne 45 -or $out.sources.Count -ne 1) {
            $out | ConvertTo-Json -Depth 5; throw "registry policy not applied"
          }
