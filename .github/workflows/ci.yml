name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  static-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --workspace --target ${{ matrix.target }}
      - name: Smoke test and footprint
        shell: bash
        run: |
          set -euo pipefail
          BIN=target/${{ matrix.target }}/release/nandi
          ls -la "$BIN"
          file "$BIN"
          DIR=$(mktemp -d)
          "$BIN" init --dir "$DIR" >/dev/null
          "$BIN" policy validate -c "$DIR/nandi.yaml"
          "$BIN" run -c "$DIR/nandi.yaml" & PID=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8788/healthz >/dev/null && break; sleep 0.5; done
          curl -sf http://127.0.0.1:8788/healthz
          RSS=$(awk '/VmRSS/ {print $2}' /proc/$PID/status)
          SIZE=$(stat -c %s "$BIN")
          kill $PID; wait $PID || true
          echo "binary: $SIZE bytes, idle RSS: $RSS KiB"
          echo "### ${{ matrix.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo "binary: $((SIZE / 1024 / 1024)) MiB, idle RSS: $((RSS / 1024)) MiB" >> "$GITHUB_STEP_SUMMARY"
          "$BIN" eval --dir eval/scenarios --min-detection 1.0 --max-false-positives 0.0

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: eval
      - name: Attack and false-positive evaluation (release build)
        run: cargo test --release --locked -p nandi-eval -- --nocapture bundled_corpus 2>&1 | tee eval.txt
      - name: Summary
        if: always()
        run: grep -A40 '^category' eval.txt >> "$GITHUB_STEP_SUMMARY" || true
