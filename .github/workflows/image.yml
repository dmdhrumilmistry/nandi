name: Image

# Publishes docker.io/<DOCKERHUB_USERNAME>/nandi. The repository needs the
# DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets (a Docker Hub access token
# with read and write scope). main publishes :main and :sha-<short>; a v* tag
# publishes the version, major.minor and :latest. Without the secrets the
# image is built but not pushed.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  binary:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: image-${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p nandi --target ${{ matrix.target }}
      - name: Smoke test
        run: target/${{ matrix.target }}/release/nandi version
      - uses: actions/upload-artifact@v4
        with:
          name: nandi-${{ strategy.job-index }}
          path: target/${{ matrix.target }}/release/nandi
          retention-days: 3
      - run: echo "${{ matrix.platform }}" > platform.txt
      - uses: actions/upload-artifact@v4
        with:
          name: platform-${{ strategy.job-index }}
          path: platform.txt
          retention-days: 3

  image:
    needs: binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Lay out binaries per platform
        run: |
          for i in 0 1; do
            p=$(cat artifacts/platform-$i/platform.txt)
            mkdir -p dist/$p
            install -m 0755 artifacts/nandi-$i/nandi dist/$p/nandi
          done
          mkdir -p dist/data
          find dist -type f
      - id: creds
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$USERNAME" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "namespace=docker.io/$USERNAME" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "namespace=docker.io/dmdhrumilmistry" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are not set; building without pushing."
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: steps.creds.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.creds.outputs.namespace }}/nandi
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=nandi
            org.opencontainers.image.description=Gateway and runtime monitor for AI agents
            org.opencontainers.image.licenses=Apache-2.0
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.creds.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Check the image runs
        run: |
          docker buildx build --load --platform linux/amd64 -f Dockerfile.release -t nandi:check .
          docker run --rm nandi:check version
