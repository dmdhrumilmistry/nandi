[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
  # rsa (via jsonwebtoken's rust_crypto backend): Marvin timing side channel on
  # private-key decryption and signing. nandi only verifies RSA signatures with
  # public keys, which the advisory does not affect. No fixed release exists.
  { id = "RUSTSEC-2023-0071", reason = "only RSA public-key verification is used" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
  "BSL-1.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
